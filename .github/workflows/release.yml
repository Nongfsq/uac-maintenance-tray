name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build release archive
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/Build-Release.ps1 -Version $version
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          if (gh release view $tag 2>$null) {
            gh release upload $tag ./artifacts/release/* --clobber
          }
          else {
            gh release create $tag ./artifacts/release/* --verify-tag --generate-notes --title $tag
          }
